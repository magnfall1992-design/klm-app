<!-- build v12 : taches du jour precises et reparties Ba / Djibril (inversees chaque jour) + achats (expression des besoins) dans Materiel ; v11 : utilisateur Observateur (code lecture seule) ; v10 2026-10 : version autonome (Google Sheets + Apps Script), sans Claude ; base v9 2026-10-03 : annuler une saisie + bouton Sortir ; v8 (donnees remises a zero) : taches non prevues par espece (obligatoire) + fertilisation/desherbage/semis/pepiniere/triage/conditionnement/conservation + tout signalement a regler (bouton regler) -->

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&amp;display=swap">
<style>
:root{
  --ground:#f6f2e6; --panel:#fffdf6; --panel2:#efe9d8; --ink:#23281e; --muted:#6d7261;
  --line:#ddd6c2; --green:#1e4d2b; --green-soft:#e4eddc; --leaf:#4c8a3f; --terre:#b0552a;
  --terre-soft:#f3e2d6; --ok:#3f7f3f; --warn:#b5750f; --crit:#a83226; --chip:#eae4d2;
  --btn-bg:#1e4d2b; --btn-terre:#b0552a; --header-bg:#1e4d2b;
  --shadow:0 1px 3px rgba(35,40,30,.08),0 4px 14px rgba(35,40,30,.06);
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#14170f; --panel:#1d2116; --panel2:#242a1c; --ink:#ece7d6; --muted:#a1a68f;
    --line:#39402c; --green:#87b873; --green-soft:#26301e; --leaf:#8fbc7a; --terre:#d98d5f;
    --terre-soft:#38281c; --ok:#7db06a; --warn:#d9a03c; --crit:#d96a5a; --chip:#2b3122;
    --btn-bg:#33582a; --btn-terre:#9c4d26; --header-bg:#1d3317;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --ground:#14170f; --panel:#1d2116; --panel2:#242a1c; --ink:#ece7d6; --muted:#a1a68f;
  --line:#39402c; --green:#87b873; --green-soft:#26301e; --leaf:#8fbc7a; --terre:#d98d5f;
  --terre-soft:#38281c; --ok:#7db06a; --warn:#d9a03c; --crit:#d96a5a; --chip:#2b3122;
  --btn-bg:#33582a; --btn-terre:#9c4d26; --header-bg:#1d3317;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:'Atkinson Hyperlegible',system-ui,sans-serif;font-size:16px;line-height:1.45;
  padding-bottom:76px}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;margin:0}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
header.top{position:sticky;top:0;z-index:20;background:var(--header-bg);color:#f6f2e6;box-shadow:var(--shadow)}
:root[data-theme="dark"] header.top,html header.top{color:#f6f2e6}
header.top .wrap{display:flex;align-items:center;gap:10px;padding:10px 14px}
.logomark{width:34px;height:34px;border-radius:50%;flex:none}
.logo{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:1.15rem;line-height:1.1}
.logo small{display:block;font-family:'Atkinson Hyperlegible',sans-serif;font-weight:400;font-size:.68rem;opacity:.85;letter-spacing:.06em;text-transform:uppercase}
.spacer{flex:1}
.userchip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);color:inherit;
  border-radius:999px;padding:4px 12px;font-size:.8rem;cursor:pointer;font-family:inherit}
.banner{background:var(--warn);color:#fff;padding:7px 14px;font-size:.82rem;display:none}
.banner.show{display:block}
main{padding-top:14px}
.tabpane{display:none}
.tabpane.active{display:block}
.cards2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.card h3{font-size:.78rem;font-family:'Atkinson Hyperlegible',sans-serif;font-weight:700;
  text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:6px}
.kpi{font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi small{font-size:.85rem;font-weight:400;color:var(--muted)}
.kpi-sub{font-size:.78rem;color:var(--muted);margin-top:3px}
.sect{margin:16px 0}
.sect>h2{font-size:1.12rem;margin-bottom:8px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.75rem;font-weight:700}
.pill.ok{background:var(--green-soft);color:var(--ok)}
.pill.warn{background:var(--terre-soft);color:var(--warn)}
.pill.crit{background:var(--terre-soft);color:var(--crit)}
ul.todo{list-style:none;margin:0;padding:0}
ul.todo li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
ul.todo li:last-child{border-bottom:0}
.dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none}
.dot.g{background:var(--leaf)}.dot.t{background:var(--terre)}.dot.w{background:var(--warn)}
.todo b{font-weight:700}
.todo .why{color:var(--muted);font-size:.82rem}
.btn{display:inline-block;border:0;border-radius:10px;padding:11px 16px;font-family:inherit;
  font-size:.95rem;font-weight:700;cursor:pointer;background:var(--btn-bg);color:#f6f2e6}
.btn.terre{background:var(--btn-terre)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:7px 12px;font-size:.83rem;border-radius:8px}
.qcrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.chip{background:var(--green-soft);color:var(--ink);border:1.5px solid var(--line);border-radius:999px;
  padding:9px 14px;font-size:.9rem;font-weight:700;font-family:inherit;cursor:pointer}
.chip:active{transform:scale(.96)}
.invgrid{display:grid;grid-template-columns:1fr;gap:10px}
.invc{display:flex;gap:10px;border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--panel)}
.invc .ph{width:74px;height:74px;object-fit:cover;border-radius:9px;flex:none}
.invc .noph{display:flex;align-items:center;justify-content:center;font-size:1.6rem;background:var(--green-soft)}
.invc .invb{flex:1;min-width:0}
.invc .plq{max-height:56px;border-radius:7px;margin:4px 0;display:block}
.invc .why{font-size:.8rem;color:var(--muted,#777);margin:2px 0}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
form .f{margin-bottom:10px}
label{display:block;font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:3px}
input,select,textarea{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:9px;
  background:var(--panel);color:var(--ink);font-family:inherit;font-size:.95rem}
input:focus,select:focus,textarea:focus,.btn:focus,.userchip:focus{outline:2.5px solid var(--leaf);outline-offset:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
  border-bottom:1.5px solid var(--line);padding:5px 6px}
td{padding:6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tscroll{overflow-x:auto}
.num{text-align:right}
.muted{color:var(--muted)}
.chart{display:flex;align-items:flex-end;gap:6px;height:110px;padding-top:14px}
.chart .bar{flex:1;background:var(--leaf);border-radius:4px 4px 0 0;position:relative;min-height:2px}
.chart .bar.obj{background:var(--panel2);border:1px dashed var(--line)}
.chart .bar span{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:.68rem;color:var(--ink);white-space:nowrap}
.chart-x{display:flex;gap:6px;font-size:.7rem;color:var(--muted);text-align:center}
.chart-x div{flex:1}
.quinz{background:var(--green-soft);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.quinz h3{font-size:.95rem;color:var(--green);font-family:'Fraunces',Georgia,serif}
.planline{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.9rem;align-items:baseline}
.planline:last-child{border-bottom:0}
.tag{flex:none;width:88px;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;border-radius:6px;padding:3px 4px;text-align:center}
.tag.S{background:#f6c445;color:#4a3a08}.tag.D{background:#f9e08e;color:#4a3a08}
.tag.P{background:#4c8a3f;color:#fff}.tag.R{background:#b0552a;color:#fff}.tag.E{background:var(--chip);color:var(--muted)}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1.5px solid var(--line);z-index:30}
nav.bottom .wrap{display:flex;padding:0}
nav.bottom button{flex:1;background:none;border:0;padding:8px 2px 10px;font-family:inherit;font-size:.6rem;
  color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.bottom button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.bottom button.active{color:var(--green);font-weight:700}
.empty{color:var(--muted);font-size:.88rem;font-style:italic;padding:8px 0}
.report{white-space:pre-wrap;background:var(--panel2);border-radius:10px;padding:12px;font-size:.85rem;
  font-family:ui-monospace,Menlo,Consolas,monospace;overflow-x:auto}
.del{background:none;border:0;color:var(--crit);cursor:pointer;font-size:1rem;padding:2px 6px}
.toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:var(--btn-bg);color:#f6f2e6;
  padding:9px 18px;border-radius:999px;font-size:.86rem;box-shadow:var(--shadow);opacity:0;transition:opacity .25s;pointer-events:none;z-index:40}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sbtn{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:18px 8px 14px;
  font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:var(--shadow)}
.sbtn .pic{font-size:46px;line-height:1}
.sbtn .lbl{font-size:1rem;font-weight:700;color:var(--ink)}
.sbtn:active{border-color:var(--leaf);background:var(--green-soft)}
.sok{position:fixed;inset:0;background:var(--btn-bg);color:#f6f2e6;display:none;z-index:60;
  flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:90px}
.sok.show{display:flex}
.sok .m{font-size:1.3rem;font-weight:700}
.scangrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.scangrid .sc{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--panel)}
.scangrid img{width:100%;height:100px;object-fit:cover;display:block}
.scangrid .b{position:absolute;top:4px;left:4px;font-size:.62rem;font-weight:700;border-radius:6px;padding:1px 6px;color:#fff}
.scangrid .b.att{background:var(--crit)}.scangrid .b.prod{background:#4c8a3f}.scangrid .b.ano{background:var(--warn)}
.scangrid .cap{font-size:.66rem;padding:3px 5px;color:var(--muted);line-height:1.25}
.scanbig{width:100%;border:2.5px dashed var(--leaf);background:var(--green-soft);border-radius:14px;
  padding:20px 10px;font-family:inherit;font-size:1.05rem;font-weight:700;color:var(--ink);cursor:pointer}
.scanbig .pic{font-size:40px;display:block;margin-bottom:6px}
ul.chk{list-style:none;margin:0;padding:0}
ul.chk li{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
ul.chk li:last-child{border-bottom:0}
ul.chk li.done b{text-decoration:line-through;color:var(--muted)}
.ck{width:38px;height:38px;flex:none;border-radius:10px;border:2px solid var(--leaf);background:var(--panel);
  color:var(--ground);font-size:1.25rem;font-weight:700;cursor:pointer;font-family:inherit;line-height:1}
.ck.on{background:var(--leaf)}
.prog{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;margin:4px 0 8px}
.prog i{display:block;height:100%;background:var(--leaf);border-radius:99px}
.xgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.xbtn{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:10px 4px 8px;font-family:inherit;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink);font-size:.82rem;font-weight:700}
.xbtn .pic{font-size:26px;line-height:1}
.xbtn.on{border-color:var(--leaf);background:var(--green-soft)}
.chip.on,.rad:has(input:checked){background:var(--green);color:var(--ground);border-color:var(--green)}
.rad{position:relative;display:inline-block}
.rad input{position:absolute;opacity:0;pointer-events:none}
.rad small{display:block;font-weight:400;font-size:.72rem;opacity:.85}
.xform{margin-top:12px;padding-top:12px;border-top:1.5px dashed var(--line)}
.fixbox{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.fixbox .btnrow{margin:0}
.xdel{background:none;border:1.5px solid var(--crit);color:var(--crit);border-radius:8px;padding:5px 10px;font-family:inherit;font-weight:700;font-size:.8rem;cursor:pointer;white-space:nowrap}
.xdel.sure{background:var(--crit);color:#fff}
.userchip{white-space:nowrap}
.exitbtn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:inherit;border-radius:50%;width:34px;height:34px;padding:0;flex:none;font-size:1.05rem;cursor:pointer;font-family:inherit;font-weight:700}
.bye{position:fixed;inset:0;background:var(--header-bg);color:#f6f2e6;display:none;z-index:70;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
.bye.show{display:flex}
.bye h2{font-size:1.5rem}
.bye p{margin:0;opacity:.9;max-width:300px}
body.ro #app form, body.ro .xgrid, body.ro .xform, body.ro #detsaisie, body.ro [data-del], body.ro [data-fix], body.ro [data-fixok], body.ro [data-verif], body.ro [data-resolve], body.ro [data-refill], body.ro [data-pt], body.ro [data-achok], body.ro .scanbig, body.ro #btn-scan{display:none!important}
body.ro .ck{pointer-events:none}
body.ro .sect.card:has(.xgrid){display:none}
body.ro .banner{background:var(--green)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);max-width:340px;width:90%}
dialog::backdrop{background:rgba(20,23,15,.5)}
</style>

<script>
'use strict';
/* ---------- capture du document vierge AVANT tout rendu (pour l'auto-publication) ---------- */

/* ---------- etat partage (embarque dans la page, republie a chaque saisie) ---------- */
let S = JSON.parse(document.getElementById('kl-state').textContent);
if (!S.scans) S.scans = [];
if (!S.inventaire) S.inventaire = [];
if (!S.achats) S.achats = [];

/* ---------- referentiel : calendrier cultural v2 (demi-mois 0 = sept-1 2026 ... 11 = fev-2 2027) ---------- */
const CAL = [
 {c:'Laitues + romaine', a:[['S',0,10],['P',2,12],['R',4,12]]},
 {c:'Roquette · mâche · épinard · bok choy', a:[['D',2,10],['R',4,12]]},
 {c:'Choux + collard + kale (FILET !)', a:[['S',1,4],['P',3,6],['R',7,12]]},
 {c:'Brocoli + kohlrabi', a:[['S',2,5],['P',4,7],['R',8,12]]},
 {c:'Radis · navet · betterave · carotte', a:[['D',2,11],['R',3,12]]},
 {c:'Poireau + céleri', a:[['S',1,3],['P',4,6],['R',10,12]]},
 {c:'Pois Sugar Pod / snap', a:[['D',4,7],['R',8,12]]},
 {c:'Oignon Violet de Galmi', a:[['S',3,7],['P',6,10]]},
 {c:'Gombo (hors-sol)', a:[['D',0,2],['R',3,8],['E',8,11],['D',11,12]]},
 {c:'Tomate (2 vagues, pièges Tuta)', a:[['S',1,3],['P',3,5],['S',4,6],['P',6,8],['R',8,12]]},
 {c:'Concombre + haricot ailé', a:[['D',2,5],['R',6,10]]},
 {c:'Melon + pastèque', a:[['D',3,6],['R',9,12]]},
 {c:'Fraise (filet oiseaux)', a:[['P',3,5],['R',8,12]]},
 {c:'Maïs doux · tournesol', a:[['D',0,3],['R',6,8],['D',11,12]]},
 {c:'Agrumes + moringa (R34/R40)', a:[['P',0,2],['E',2,12]]},
 {c:'Fourrage : Panicum · Cajanus · Gliricidia', a:[['P',0,2],['E',2,12]]},
 {c:'Brise-vent + passiflore', a:[['P',0,2],['E',2,12]]},
 {c:'Papayers + patate douce + niébé', a:[['P',0,2],['E',2,12]]}
];
const TAGLBL = {S:'Semis pép.', D:'Semis direct', P:'Plantation', R:'Récolte', E:'Entretien'};
const PRODUITS = {
 'Légumes': ['Laitue','Roquette','Mâche','Épinard','Bok choy','Chou','Collard','Kale','Brocoli','Kohlrabi',
  'Radis','Navet','Betterave','Carotte','Panais','Poireau','Céleri','Pois','Oignon Galmi','Gombo','Tomate',
  'Concombre','Haricot ailé','Courge','Maïs doux'],
 'Fruits & agrumes': ['Melon','Pastèque','Fraise','Papaye','Fruit de la passion','Citron lime (Tahiti)',
  'Citron caviar','Mandarine','Clémentine'],
 'Aromatiques': ['Citronnelle','Menthe ordinaire','Menthe poivrée','Menthe FASS','Feuille de moringa',
  'Feuille de bissap','Fleur de bissap','Aromatiques (bottes)'],
 'Élevage': ['Poulet local','Bleu de Hollande','Poulet de chair','Poulet fermier','Rainbow','Goliath',
  'Chèvre','Bouc','Lait frais','Œufs'],
 'Autre': ['Autre']
};
const CULTURES = Object.values(PRODUITS).flat();
function optsG(sel){
  return Object.entries(PRODUITS).map(([g,items])=>'<optgroup label="'+esc(g)+'">'+

function vPlan(){
  const hm = halfMonth(new Date());
  const now = [], later = [];
  for (const row of CAL){
    for (const [t,a,b] of row.a){
      if (a<=hm && hm<b) now.push([t,row.c]);
      else if (a===hm+1) later.push([t,row.c]);
    }
  }
  const MONTHS = ['sept','sept','oct','oct','nov','nov','déc','déc','janv','janv','févr','févr'];
  const Q = ['1re quinzaine','2e quinzaine'];
  function lines(list){ return list.length? list.map(([t,c])=>'<div class="planline"><span class="tag '+t+'">'+TAGLBL[t]+'</span><span>'+esc(c)+'</span></div>').join('') : '<div class="empty">rien de prévu</div>'; }
  let full = '';
  for (let h=0; h<12; h++){
    const items = [];
    for (const row of CAL) for (const [t,a,b] of row.a){ if (t!=='E' && a<=h && h<b) items.push([t,row.c]); }
    full += '<details'+(h===hm?' open':'')+'><summary style="padding:8px 0;font-weight:700;cursor:pointer">'+MONTHS[h]+' — '+Q[h%2]+(h===hm?' · <span class="pill ok">maintenant</span>':'')+'</summary>'+lines(items)+'</details>';
  }
  return `
  <div class="quinz"><h3>Cette quinzaine (${MONTHS[hm]} — ${Q[hm%2]})</h3>${lines(now)}</div>
  <div class="sect card"><h3>Quinzaine suivante — préparer</h3>${lines(later)}</div>
  <div class="sect card"><h3>Campagne complète sept 2026 → févr 2027</h3>${full}
    <p class="muted" style="font-size:.8rem">Référence : calendrier cultural v2 (guide A4). Oignon récolté mars-mai.</p></div>`;
}

function buildReport(){
  const ws = weekStart(new Date()); const we = new Date(ws); we.setDate(we.getDate()+6);
  const inWeek = s => { const d = new Date(s+'T12:00'); return d>=ws && d<=new Date(we.getTime()+86399000); };
  const rec = S.recoltes.filter(r=>inWeek(r.d));
  const ven = S.ventes.filter(v=>inWeek(v.d));
  const ops = S.ops.filter(o=>inWeek(o.d));
  const att = S.attaques.filter(a=>inWeek(a.d));
  const kg = rec.reduce((s,r)=>s+(+r.kg||0),0);
  const fcfa = ven.reduce((s,v)=>s+(+v.montant||0),0);
  const byC = {};
  for (const r of rec) byC[r.culture] = (byC[r.culture]||0)+(+r.kg||0);
  const L = [];
  L.push('RAPPORT KEUR LEMOU — semaine ' + isoWeek(new Date()));
  L.push('du ' + ws.toLocaleDateString('fr-FR') + ' au ' + we.toLocaleDateString('fr-FR'));
  L.push('');
  L.push('RECOLTES : ' + Math.round(kg*10)/10 + ' kg (objectif ' + OBJ_HEBDO[halfMonth(new Date())] + ' kg)');
  for (const [c,v] of Object.entries(byC)) L.push('  - ' + c + ' : ' + Math.round(v*10)/10 + ' kg');
  L.push('VENTES : ' + REC_FMT.format(fcfa) + ' FCFA (' + ven.length + ' vente' + (ven.length>1?'s':'') + ')');
  L.push('');
  const tk = ops.filter(o=>o.type==='Tâche');
  const joursTk = {}; for (const o of tk) joursTk[o.d] = (joursTk[o.d]||0)+1;
  L.push('TACHES DU JOUR COCHEES : ' + tk.length + (tk.length ? ' (' + Object.entries(joursTk).map(([d,n])=>fmtD(d)+' : '+n).join(' · ') + ')' : ''));
  if (tk.length) L.push('  - ' + TECHS.map(n=>n+' : '+tk.filter(o=>o.par===n).length).join(' · '));
  const tr = ops.filter(o=>o.type==='Traitement');
  L.push('TRAITEMENTS (' + tr.length + ') :' + (tr.length ? '' : ' aucun'));
  for (const o of tr) L.push('  - ' + fmtD(o.d) + ' ' + (o.produit||'') + ' sur ' + o.culture + (o.detail && o.detail!==o.produit ? ' — ' + o.detail.replace((o.produit||'')+' — ','') : ''));
  const opsX = ops.filter(o=>o.type!=='Tâche' && o.type!=='Traitement');
  L.push('');
  L.push('AUTRES OPERATIONS (' + opsX.length + ') :');
  for (const o of opsX) L.push('  - ' + fmtD(o.d) + ' ' + o.type + ' ' + o.culture + (o.detail? ' — '+o.detail : ''));
  L.push('');
  const ao = attaquesOuvertes();
  L.push('ATTAQUES : ' + (att.length ? att.map(a=>a.ravageur+' sur '+a.culture+' (G'+a.gravite+')').join(' ; ') : 'rien de nouveau'));
  const ar = aRegler();
  L.push('A REGLER (' + ar.length + ') : ' + (ar.length ? ar.map(x=>x.t+' ['+fmtD(x.d)+']').join(' ; ') : 'rien'));
  const rg = [].concat(S.attaques, S.ops, S.scans||[]).filter(x=>x && x.regle && inWeek(x.regle.d));
  L.push('REGLES CETTE SEMAINE (' + rg.length + ')' + (rg.length ? ' : ' + rg.map(x=>(x.ravageur||x.detail||'photo')+(x.regle.note?' — '+x.regle.note:'')+' ('+(x.regle.par||'')+')').join(' ; ') : ''));
  const scw = S.scans.filter(x=>inWeek(x.d));
  L.push('SCANS PHOTO : ' + scw.length + ' (' + scw.filter(x=>x.type==='att').length + ' attaques, ' + scw.filter(x=>x.type==='prod').length + ' productions, ' + scw.filter(x=>x.type==='ano').length + ' anomalies)');
  const invA = S.inventaire.filter(it=>it.etat!=='réformé');
  if (invA.length){
    const mois = moisCourant();
    const pt = invA.filter(it=>(it.checks||[]).some(c=>c.mois===mois));
    const rep = invA.filter(it=>it.etat==='à réparer');
    L.push('MATERIEL : ' + pt.length + '/' + invA.length + ' pointés ce mois-ci' + (rep.length? ' — à réparer : ' + rep.map(it=>it.nom).join(', ') : ''));
  }
  const achO = achatsOuverts();
  const achW = (S.achats||[]).filter(a=>a.statut==='acheté' && a.achete && inWeek(a.achete.d));
  L.push('ACHATS A FAIRE (' + achO.length + ')' + (achO.length ? ' :' : ' : rien'));
  for (const a of achO) L.push('  - [' + (a.urg||'') + '] ' + (a.des||'') + ' — ' + (a.qte||'') + ' (' + (a.cat||'') + (a.spec?', '+a.spec:'') + (a.qual?', qualité '+a.qual:'') + ') — ' + (a.par||''));
  if (achW.length) L.push('ACHETES CETTE SEMAINE (' + achW.length + ') : ' + achW.map(a=>a.des).join(', '));
  L.push('');
  L.push('Rapport généré par Keur Lemou Exploitation' + (USER? ' — saisi par ' + USER : ''));
  return L.join('\n');
}
function csv(){
  const q = x => '"'+String(x==null?'':x).replace(/"/g,'""')+'"';
  const L = ['type;date;culture_produit;kg_ou_qte;vendus_kg;montant_fcfa;detail;par'];
  for (const r of S.recoltes) L.push(['recolte',r.d,r.culture,(r.kg||'')+' '+(r.unite||'kg'),r.vendus||'',r.prix||'','',r.par||''].map(q).join(';'));
  for (const v of S.ventes)   L.push(['vente',v.d,v.produit,v.qte||'','',v.montant,v.client||'',v.par||''].map(q).join(';'));
  for (const o of S.ops)      L.push([o.type==='Tâche'?'tache':'operation',o.d,o.culture,'','','',o.type+' '+(o.detail||'')+(o.verifie?' (verifie '+o.verifie.d+')':''),o.par||''].map(q).join(';'));
  for (const a of S.attaques) L.push(['attaque',a.d,a.culture,'','','',a.ravageur+' G'+a.gravite+(a.resolu?' (reglee)':''),a.par||''].map(q).join(';'));
  for (const x of S.scans)    L.push(['scan',x.d,x.culture||'','','','',(SCAN_LBL[x.type]||'')+' '+(x.note||''),x.par||''].map(q).join(';'));
  for (const it of S.inventaire){
    const dernier = (it.checks||[]).slice(-1)[0];
    L.push(['materiel',it.ajoute||'',it.nom,'','','',(it.cat||'')+' '+(it.specs||'')+' — etat '+(it.etat||'')+(dernier?' — pointe '+dernier.d:''),it.par||''].map(q).join(';'));
  }
  for (const a of (S.achats||[])) L.push(['achat',a.d,a.des,a.qte||'','','',(a.cat||'')+' — '+(a.spec||'')+' — qualite '+(a.qual||'')+' — urgence '+(a.urg||'')+' — '+(a.statut||''),a.par||''].map(q).join(';'));
  return L.join('\n');
}

document.getElementById('scaninput').addEventListener('change', function(){
  const file = this.files && this.files[0];
  if (!file) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    const im = new Image();
    im.onload = ()=>{
      const c = CAP || {cb:img=>{ scanImg = img; scanDialog(); }, mx:320, q:0.55};
      const k = Math.min(1, c.mx/Math.max(im.width, im.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(im.width*k); cv.height = Math.round(im.height*k);
      cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
      c.cb(cv.toDataURL('image/jpeg', c.q));
    };
    im.src = rd.result;
  };
  rd.readAsDataURL(file);
});

      <div class="btnrow">
        <button type="button" class="btn ghost" id="btn-invph">📷 Photo de l'équipement</button>
        <button type="button" class="btn ghost" id="btn-invplq">📷 Plaque signalétique</button>
      </div>
      <div class="btnrow"><img id="invprev1" style="display:none;height:56px;border-radius:8px" alt="aperçu"><img id="invprev2" style="display:none;height:56px;border-radius:8px" alt="aperçu plaque"></div>
      <button class="btn">Ajouter au matériel</button>
    </form></div>
  <div class="sect card"><h3>Matériel (${S.inventaire.length})</h3>
    ${cards ? '<div class="invgrid">'+cards+'</div>' : '<div class="empty">aucun équipement — ajoute-les une fois, ensuite le pointage mensuel prend 10 minutes</div>'}</div>`;
}

function render(){
  renderTabs();
  const app = document.getElementById('app');
  if (USER==='Samba') TAB = 'samba';
  const views = {tb:vTableau, plan:vPlan, journal:vJournal, rec:vRecoltes, vente:vVentes, rap:vRapport, samba:vSamba, scan:vScan, inv:vInv};
  app.innerHTML = '<div class="tabpane active">' + views[TAB]() + '</div>';
  wire();
}

function wire(){
  const fop = document.getElementById('f-op');
  if (fop){
    fop.addEventListener('submit', e=>{
      e.preventDefault(); const f = new FormData(fop);
      LAST_OP = {d:f.get('d'), type:f.get('type'), culture:f.get('culture')};
      record('ops', {d:f.get('d'), type:f.get('type'), culture:f.get('culture'), detail:f.get('detail'), par:USER}, f.get('type')+' — '+f.get('culture')+' noté');
    });
    fop.querySelectorAll('[data-qc]').forEach(b=>b.addEventListener('click', ()=>{
      const f = new FormData(fop);
      const c = b.dataset.qc;
      LAST_OP = {d:f.get('d'), type:f.get('type'), culture:c};
      record('ops', {d:f.get('d'), type:f.get('type'), culture:c, detail:f.get('detail'), par:USER}, f.get('type')+' — '+c+' noté');
    }));
  }
  document.querySelectorAll('[data-refill]').forEach(b=>b.addEventListener('click', ()=>{
    const o = S.ops[+b.dataset.refill];
    if (!o) return;
    LAST_OP = {d:today(), type:o.type, culture:o.culture};
    render(); window.scrollTo(0,0);
    const det = document.querySelector('#f-op input[name="detail"]');
    if (det && o.detail) det.value = o.detail;
    toast('Formulaire pré-rempli : '+o.type+' — '+o.culture);
  }));
  const det = document.getElementById('detsaisie');
  if (det) det.addEventListener('toggle', ()=>{ DET_OPEN = det.open; });
  /* v9 : fermer un formulaire sans enregistrer */
  document.querySelectorAll('[data-xcancel]').forEach(b=>b.addEventListener('click', ()=>{ EXTRA = null; TR_SEL = []; render(); toast('Rien n’a été enregistré'); }));
  /* v9 : annuler une saisie (2 touches : annuler puis confirmer) */
  document.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', ()=>{
    const k = b.dataset.del;
    if (DEL !== k){ DEL = k; render(); setTimeout(()=>{ if (DEL===k){ DEL=null; render(); } }, 6000); return; }
    const [col, i] = k.split(':'); const row = S[col] && S[col][+i];
    DEL = null;
    if (!row){ render(); return; }
    S[col].splice(+i, 1);
    render(); delRow(col, row); toast('Saisie annulée');
  }));
  /* v7 : cocher / decocher une tache du jour */
  document.querySelectorAll('[data-tk]').forEach(b=>b.addEventListener('click', ()=>{
    const t = TACHES_CUR[+b.dataset.tk]; if (!t) return;
    if (isTech(USER) && t.qui && t.qui!==USER){ toast('Tâche de '+t.qui+' — c’est lui qui la coche'); return; }
    const ds = today(); const ex = tacheFaite(ds, t.b);
    if (ex){
      S.ops.splice(S.ops.indexOf(ex), 1);
      render(); delRow('ops', ex); toast('Tâche décochée');
    } else record('ops', {d:ds, type:'Tâche', culture:'Routine', detail:t.b, qui:t.qui||'', par:USER}, '✓ '+t.b);
  }));
  /* v7 : taches non prevues */
  document.querySelectorAll('[data-x]').forEach(b=>b.addEventListener('click', ()=>{
    EXTRA = (EXTRA===b.dataset.x) ? null : b.dataset.x; TR_SEL = [];
    render();
    const fx = document.getElementById('f-x'); if (fx) fx.scrollIntoView({behavior:'smooth', block:'center'});
  }));
  function bindMs(b){ b.addEventListener('click', ()=>{
    const c = b.dataset.ms; const k = TR_SEL.indexOf(c);
    if (k>=0) TR_SEL.splice(k,1); else TR_SEL.push(c);
    b.classList.toggle('on', k<0);
    const s = document.getElementById('trsum'); if (s) s.textContent = TR_SEL.length ? TR_SEL.length+' espèce(s) : '+TR_SEL.join(', ') : 'aucune espèce choisie';
  }); }
  document.querySelectorAll('[data-ms]').forEach(bindMs);
  const tradd = document.getElementById('tradd');
  if (tradd) tradd.addEventListener('change', ()=>{
    const c = tradd.value; tradd.value = ''; if (!c) return;
    let b = Array.from(document.querySelectorAll('[data-ms]')).find(x=>x.dataset.ms===c);
    if (!b){ b = document.createElement('button'); b.type='button'; b.className='chip'; b.dataset.ms=c; b.textContent=c; document.getElementById('trchips').appendChild(b); bindMs(b); }
    if (!TR_SEL.includes(c)) b.click();
  });
  const fx = document.getElementById('f-x');
  if (fx) fx.addEventListener('submit', e=>{
    e.preventDefault(); const f = new FormData(fx); const typ = EXTRA;
    if (typ==='Récolte'){
      if (!f.get('culture')){ toast('Choisis l’espèce récoltée'); return; }
      EXTRA = null;
      record('recoltes', {d:f.get('d'), culture:f.get('culture'), kg:+f.get('kg'), unite:f.get('unite')||'kg', vendus:0, prix:0, par:USER}, 'Récolte enregistrée');
      return;
    }
    if (!typ) return;
    const p = f.get('produit');
    if (typ==='Traitement' && !p){ toast('Choisis le produit : tabac, savon noir + neem ou Alpha'); return; }
    if (!TR_SEL.length){ toast('Touche au moins une espèce'); return; }
    const det = (f.get('detail')||'').trim(); const cs = TR_SEL.slice();
    EXTRA = null; TR_SEL = [];
    const row = {d:f.get('d'), type:typ, culture:cs.join(', '), cultures:cs, detail:(p ? p+(det?' — '+det:'') : det), par:USER};
    if (p) row.produit = p;
    record('ops', row, typ+(p?' '+p:'')+' — '+cs.length+' espèce'+(cs.length>1?'s':'')+' noté');
  });
  /* v8 : regler un signalement */
  document.querySelectorAll('[data-fix]').forEach(b=>b.addEventListener('click', ()=>{
    FIX = b.dataset.fix; render(); const n = document.getElementById('fixnote'); if (n){ n.scrollIntoView({block:'center'}); n.focus(); }
  }));
  document.querySelectorAll('[data-fixno]').forEach(b=>b.addEventListener('click', ()=>{ FIX = null; render(); }));
  document.querySelectorAll('[data-fixok]').forEach(b=>b.addEventListener('click', ()=>{
    const o = objFix(b.dataset.fixok); if (!o) return;
    const n = document.getElementById('fixnote');
    o.regle = {d:today(), par:USER, note:(n && n.value || '').trim()};
    if (b.dataset.fixok[0]==='a') o.resolu = true;
    FIX = null; render();
    putRow({a:'attaques', o:'ops', s:'scans'}[b.dataset.fixok[0]], o); toast('Réglé ✓');
  }));
  /* v7 : signalement verifie */
  document.querySelectorAll('[data-verif]').forEach(b=>b.addEventListener('click', ()=>{
    const o = S.ops[+b.dataset.verif];
    if (o){ o.verifie = {d:today(), par:USER}; render(); putRow('ops', o); toast('Signalement vérifié'); }
  }));
  const fach = document.getElementById('f-ach');
  if (fach){
    document.getElementById('btn-achph').addEventListener('click', ()=>openCapture(img=>{
      ACH_IMG = img; const p = document.getElementById('achprev'); if (p){ p.src = img; p.style.display = 'inline-block'; } toast('Photo ajoutée');
    }, 480, 0.6));
    fach.addEventListener('submit', e=>{
      e.preventDefault(); const f = new FormData(fach);
      record('achats', {d:today(), cat:f.get('cat'), des:f.get('des'), spec:f.get('spec'), qual:f.get('qual'), qte:f.get('qte'),
        urg:f.get('urg')||'Cette semaine', img:ACH_IMG, statut:'à acheter', par:USER}, 'Demande d’achat envoyée');
      ACH_IMG = null;
    });
  }
  document.querySelectorAll('[data-achok]').forEach(b=>b.addEventListener('click', ()=>{
    const a = S.achats[+b.dataset.achok]; if (!a) return;
    a.statut = 'acheté'; a.achete = {d:today(), par:USER};
    render(); putRow('achats', a); toast(a.des+' : acheté ✓');
  }));
  const finv = document.getElementById('f-inv');
  if (finv){
    document.getElementById('btn-invph').addEventListener('click', ()=>openCapture(img=>{
      INV_IMG = img; const p = document.getElementById('invprev1'); if (p){ p.src = img; p.style.display = 'inline-block'; } toast('Photo ajoutée');
    }, 480, 0.6));
    document.getElementById('btn-invplq').addEventListener('click', ()=>openCapture(img=>{
      INV_PLAQUE = img; const p = document.getElementById('invprev2'); if (p){ p.src = img; p.style.display = 'inline-block'; } toast('Plaque ajoutée');
    }, 640, 0.65));
    finv.addEventListener('submit', e=>{
      e.preventDefault(); const f = new FormData(finv);
      record('inventaire', {nom:f.get('nom'), cat:f.get('cat'), specs:f.get('specs'), etat:f.get('etat'),
        img:INV_IMG, plaque:INV_PLAQUE, ajoute:today(), par:USER, checks:[]}, 'Équipement ajouté');
      INV_IMG = null; INV_PLAQUE = null;
    });
  }
  document.querySelectorAll('[data-pt]').forEach(b=>b.addEventListener('click', ()=>{
    const it = S.inventaire[+b.dataset.pt];
    if (!it) return;
    it.checks = it.checks || [];
    it.checks.push({mois:moisCourant(), d:today(), par:USER});
    render();
    putRow('inventaire', it); toast(it.nom+' pointé');
  }));
  const fatt = document.getElementById('f-att');
  if (fatt){
    const sel = document.getElementById('ravsel');
    sel.addEventListener('change', ()=>{ document.getElementById('riposte').textContent = 'Riposte : ' + (RAVAGEURS[sel.value]||''); });
    fatt.addEventListener('submit', e=>{
      e.preventDefault(); const f = new FormData(fatt);
      record('attaques', {d:today(), culture:f.get('culture'), ravageur:f.get('ravageur'), gravite:+f.get('gravite'), action:RAVAGEURS[f.get('ravageur')]||'', resolu:false, par:USER}, 'Attaque déclarée');
    });
  }
  const frec = document.getElementById('f-rec');
  if (frec) frec.addEventListener('submit', e=>{
    e.preventDefault(); const f = new FormData(frec);
    record('recoltes', {d:f.get('d'), culture:f.get('culture'), kg:+f.get('kg'), unite:f.get('unite')||'kg', vendus:+(f.get('vendus')||0), prix:+(f.get('prix')||0), par:USER}, 'Production enregistrée');
  });
  const fv = document.getElementById('f-vente');
  if (fv) fv.addEventListener('submit', e=>{
    e.preventDefault(); const f = new FormData(fv);
    record('ventes', {d:f.get('d'), produit:f.get('produit'), qte:f.get('qte'), montant:+f.get('montant'), client:f.get('client'), par:USER}, 'Vente enregistrée');
  });
  const bs = document.getElementById('btn-scan');
  if (bs) bs.addEventListener('click', openScan);
  document.querySelectorAll('[data-samba]').forEach(b=>b.addEventListener('click', ()=>{
    const def = SAMBA_BTNS.find(x=>x[0]===b.dataset.samba);
    if (!def) return;
    if (def[3]==='photo'){ openScan(); return; }
    sambaOk(def[1]+' ✅');
    if (def[3]==='att'){ const a = Object.assign({d:today(), action:'à vérifier par un technicien', resolu:false, par:USER}, def[4]); record('attaques', a, 'Signalement envoyé'); }
    else { const o = Object.assign({d:today(), par:USER}, def[4]); record('ops', o, 'Bien noté'); }
  }));
  document.querySelectorAll('[data-resolve]').forEach(b=>b.addEventListener('click', ()=>{
    const a = S.attaques[+b.dataset.resolve];
    if (a){ a.resolu = true; a.regle = {d:today(), par:USER}; render(); putRow('attaques', a); toast('Attaque réglée'); }
  }));
  const bc = document.getElementById('btn-copy');
  if (bc) bc.addEventListener('click', async ()=>{
    try{ await navigator.clipboard.writeText(buildReport()); toast('Rapport copié — colle-le dans WhatsApp'); }
    catch(e){ toast('Copie impossible ici — sélectionne le texte à la main'); }
  });
  const bx = document.getElementById('btn-csv');
  if (bx) bx.addEventListener('click', async ()=>{
    try{ await navigator.clipboard.writeText(csv()); toast('CSV copié — colle-le dans un message ou un tableur'); }
    catch(e){ toast('Copie impossible ici — sélectionne le texte à la main'); }
  });
}

document.getElementById('tabs').addEventListener('click', e=>{
  const b = e.target.closest('button[data-tab]');
  if (b){ TAB = b.dataset.tab; render(); window.scrollTo(0,0); }
});
document.getElementById('btnexit').addEventListener('click', ()=>{
  EXTRA = null; TR_SEL = []; FIX = null; DEL = null;
  try{ localStorage.removeItem('kl_user'); }catch(e){}
  USER = null; document.getElementById('userchip').textContent = 'moi ?';
  document.getElementById('bye').classList.add('show');
  try{ window.close(); }catch(e){}
});
document.getElementById('btnback').addEventListener('click', ()=>{
  document.getElementById('bye').classList.remove('show');
  try{ document.getElementById('whodlg').showModal(); }catch(e){}
});
document.getElementById('userchip').addEventListener('click', ()=>{
  const dlg = document.getElementById('whodlg'); dlg.showModal();
});
document.getElementById('whodlg').addEventListener('close', function(){
  if (READONLY){ applyRole(); render(); return; }
  if (this.returnValue) setUser(this.returnValue);
});

/* ---------- demarrage ---------- */
if (READONLY){ applyRole(); TAB = 'tb'; }
else if (USER){ document.getElementById('userchip').textContent = USER;
  TAB = (USER==='Madame') ? 'vente' : (isTech(USER) ? 'journal' : 'tb'); }
else { document.getElementById('userchip').textContent = 'moi ?'; setTimeout(()=>{ try{ if (!READONLY) document.getElementById('whodlg').showModal(); }catch(e){} }, 1500); }
/* cache local : l'appli s'ouvre instantanement, meme sans reseau */
try{ const c = JSON.parse(localStorage.getItem(CACHE_KEY)||'null'); if (c) S = applyOps(normState(c), outLoad()); }catch(e){}
document.getElementById('pinform').addEventListener('submit', ()=>{
  PIN = (document.getElementById('pininput').value||'').trim();
  try{ localStorage.setItem(PIN_KEY, PIN); }catch(e){}
  NET = 'init'; flush();
});
render(); updateBanner();
if (!PIN && /^https:\/\/script\.google/.test(API_URL)) askPin(false); else flush();
setInterval(pull, 60000);
window.addEventListener('online', flush);
document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='visible') pull(); });
</script>
</body></html>
